<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131416" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Dmitry Kostromitsky</title>
    <script>
      try {
        if (localStorage.getItem("portfolio-language") === "ru") {
          document.documentElement.setAttribute("data-lang-pending", "");
        }
      } catch {
        // Ignore storage errors and render the English fallback.
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/language.js" defer></script>
  </head>
  <body data-error-page>
    <main class="page">
      <div class="container">
        <header class="intro">
          <h1 id="error-title">Page not found</h1>
          <p class="lead" id="error-description">Check the address or return to the portfolio.</p>
          <nav class="error-links" id="error-navigation" aria-label="Navigation">
            <a href="/" hreflang="en" id="home-link">Back to portfolio</a>
            <a href="/ru/" hreflang="ru" lang="ru" data-language-link>Портфолио на русском</a>
          </nav>
        </header>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner" id="footer-text">© 2026 Dmitry Kostromitsky</div>
    </footer>
  </body>
</html>
